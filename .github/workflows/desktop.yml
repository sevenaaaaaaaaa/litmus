# ThirdC 桌面端多平台打包：Windows（msi/nsis）+ Linux（deb/AppImage/rpm）+ macOS（app/dmg，DMG 内置打开助手）
# 触发：手动（Actions 页 Run workflow）、推 v* 标签（正式版，附到同名 Release 并成为 Latest）
#       或推 nightly 标签（scripts/daily-release.sh 每日强制移动；附到唯一的预发布「Nightly」）。
#
# 版本：唯一版本源是 Cargo.toml [workspace.package].version，tauri.conf.json 不写 version。
#   - v* 标签：版本 = 版本源，且必须与标签一致（防止 latest.json 报错版本）。
#   - nightly 标签：版本取自附注标签首行「nightly X.Y.Z-nightly.YYYYMMDD」，只写进 CI 工作区，不提交。
#     Nightly 是 prerelease，GitHub 的 releases/latest 不含预发布，应用内更新（latest.json）永远拿不到它；
#     semver 预发布排序也保证它低于下一个正式版。
# 前端是纯静态 server/web，无需 node 构建；内核 reqwest 走 rustls，无 openssl 依赖
#
# 在线更新：createUpdaterArtifacts=true 会产出 *.sig 与 updater 归档，
# tauri-action 用 TAURI_SIGNING_PRIVATE_KEY 签名并生成 latest.json（供 App 内自更新）。
# 必需仓库 Secret：
#   TAURI_SIGNING_PRIVATE_KEY          私钥全文（~/.tauri/thirdc-updater.key）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥口令（本次生成时为空，填空字符串即可）
name: desktop
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "补发到已有 Release 的标签（如 v0.2.0；留空 = 只出 Artifacts）"
        required: false
        default: ""
      only:
        description: "只构建一个平台（windows-latest / ubuntu-22.04 / macos-14；留空 = 全部）"
        required: false
        default: ""
  push:
    tags: ["v*", "nightly"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 手动补发可只跑一个平台（inputs.only），避免与 Release 上已有的同名资产撞车
        # windows-latest → .msi + setup.exe；ubuntu-22.04 → .deb + .AppImage + .rpm；
        # macos-14 → .app + updater .app.tar.gz（DMG 由下方步骤用 packaging/macos/make-dmg.sh 打，内置打开助手）
        # 不用 include 挂 macOS 参数：include 匹配不到组合时会新增任务，单平台补发会被它带回 macOS
        os: ${{ fromJSON(inputs.only && format('["{0}"]', inputs.only) || '["windows-latest","ubuntu-22.04","macos-14"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本（正式 / Nightly）并写入 CI 工作区的 tauri.conf.json
        id: ver
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          BASE=$("$PY" -c "import re;s=open('Cargo.toml',encoding='utf-8').read();print(re.search(r'\[workspace\.package\][^\[]*?^version\s*=\s*\"([^\"]+)\"',s,re.S|re.M).group(1))")
          PRERELEASE=false
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == "nightly" ]]; then
            git fetch --force --depth=1 origin "+refs/tags/nightly:refs/tags/nightly"
            VER=$(git for-each-ref refs/tags/nightly --format='%(contents:subject)' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}' || true)
            [[ -n "$VER" ]] || { echo "::error::nightly 标签缺少版本（应为附注标签：nightly X.Y.Z-nightly.YYYYMMDD）"; exit 1; }
            D=${VER##*.}
            NAME="Nightly · ${D:0:4}-${D:4:2}-${D:6:2}"
            PRERELEASE=true
          else
            VER="$BASE"
            if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" != "v$VER" ]]; then
              echo "::error::标签 ${{ github.ref_name }} 与 Cargo.toml 版本 $VER 不一致"; exit 1
            fi
            if [[ -n "${{ inputs.tag }}" && "${{ inputs.tag }}" != "v$VER" ]]; then
              echo "::error::补发标签 ${{ inputs.tag }} 与 Cargo.toml 版本 $VER 不一致"; exit 1
            fi
            NAME="鹿蕊 Litmus v$VER"
          fi
          # MSI needs a purely numeric version (build field <= 65535): nightly uses days since 2026-01-01.
          "$PY" - "$VER" <<'PYEOF'
          import datetime, json, sys
          ver = sys.argv[1]
          core, _, pre = ver.partition("-")
          wix = core
          if pre:
              d = datetime.datetime.strptime(pre.rsplit(".", 1)[1], "%Y%m%d").date()
              wix = f"{core}.{(d - datetime.date(2026, 1, 1)).days}"
          p = "desktop/tauri.conf.json"
          c = json.load(open(p, encoding="utf-8"))
          c["version"] = ver
          b = c.setdefault("bundle", {})
          b.setdefault("macOS", {})["bundleVersion"] = core
          b.setdefault("windows", {}).setdefault("wix", {})["version"] = wix
          json.dump(c, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PYEOF
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "版本 $VER（prerelease=$PRERELEASE）"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux 系统依赖（Tauri v2：webkit2gtk-4.1 等）
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 构建 + 签名 + 发布（tauri-action）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}
          releaseName: ${{ (github.ref_type == 'tag' || inputs.tag != '') && steps.ver.outputs.name || '' }}
          releaseDraft: false
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
          args: ${{ matrix.os == 'macos-14' && '--bundles app' || '' }}

      # macOS DMG 未公证：统一用 packaging/macos/make-dmg.sh 打包，内置「打不开？双击我.command」+ 安装说明。
      # scripts/daily-release.sh / release.sh 会先上传本地打好的同名 DMG；已存在则跳过，不覆盖。
      - name: macOS DMG（内置 Gatekeeper 打开助手）
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          DMG="target/release/bundle/dmg/Litmus_${VER}_aarch64.dmg"
          bash packaging/macos/make-dmg.sh target/release/bundle/macos/Litmus.app "$DMG" Litmus
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$DMG")"; then
              echo "Release 已有 $(basename "$DMG")（本地脚本已上传），跳过"
            else
              gh release upload "$TAG" "$DMG"
            fi
          fi

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -type f \( \
            -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \
            -o -name '*.sig' -o -name '*.tar.gz' -o -name '*.zip' \) \
            -not -name 'rw.*' -exec cp {} dist/ \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ThirdC-Desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

      # R2 镜像（可选）：仓库变量 R2_ENABLED=true 时把产物同步到 Cloudflare R2。
      # 需要 Secrets：R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT / R2_BUCKET，
      # 变量：R2_PUBLIC_BASE（自定义域名，用于重写 latest.json 的下载地址）。
      - name: 同步到 R2（可选）
        if: ${{ vars.R2_ENABLED == 'true' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash deploy/r2-sync.sh dist
