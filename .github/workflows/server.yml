# Litmus 服务器端二进制：x86_64 musl 静态链接，glibc 2.17（CentOS 7）及以上直接可跑。
# 部署从此不碰生产机的 cargo：下载本产物上传换 bin/litmus 即可（内存窒息的 OOM 教训）。
name: server
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["kernel/**", "server/**", "cli/**", "mcp/**", "Cargo.toml", "Cargo.lock", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: musl 工具链（rusqlite bundled SQLite 要编 C）
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: 构建（静态链接）
        run: cargo build --release -p litmus --target x86_64-unknown-linux-musl

      - name: 冒烟（runner 上直接跑，验证静态可执行）
        run: target/x86_64-unknown-linux-musl/release/litmus --help > /dev/null

      - name: 打包
        run: |
          tar czf litmus-linux-x86_64-musl.tar.gz -C target/x86_64-unknown-linux-musl/release litmus
          sha256sum litmus-linux-x86_64-musl.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: litmus-linux-x86_64-musl
          path: litmus-linux-x86_64-musl.tar.gz
          if-no-files-found: error

      - name: 附到 GitHub Release（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: litmus-linux-x86_64-musl.tar.gz
