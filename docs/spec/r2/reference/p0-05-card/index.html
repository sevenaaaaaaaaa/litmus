<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹿蕊 · 卡解剖 v1（只读原型）</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="bar">
  <div class="mark">鹿蕊<span class="dot">·</span>卡解剖 v1</div>
  <div class="states" role="group" aria-label="切换卡片状态">
    <button data-state="seed">种子</button>
    <button data-state="grounded">有据</button>
    <button data-state="tension">有张力</button>
    <button data-state="settled">已定</button>
    <button data-state="shipped">已发布</button>
  </div>
  <div class="tools">
    <label class="switch"><input type="checkbox" id="colorOnly" /> 只靠颜色</label>
    <button id="check">3 秒自检</button>
  </div>
</header>

<main class="canvas" id="canvas">
  <div class="hint">Space 翻开卡背 · ⌘↩ 推进 · ⌘⇧↩ 连到 · ⌘⇧P 发布 · Esc 退回</div>
  <div class="stack" id="stack"></div>
  <aside class="toast" id="toast" role="status" aria-live="polite"></aside>
  <aside class="check" id="checkPanel" hidden></aside>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-dotted-circle" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2.4"/></symbol>
  <symbol id="i-circle-check" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 8.2l2 2 4-4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-triangle-alert" viewBox="0 0 16 16"><path d="M8 2.6l6 10.8H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.6v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".9" fill="currentColor"/></symbol>
  <symbol id="i-square" viewBox="0 0 16 16"><rect x="2.8" y="2.8" width="10.4" height="10.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="i-badge-check" viewBox="0 0 16 16"><path d="M8 1.8l1.7 1.2 2-.1.6 1.9 1.7 1.1-.6 1.9.6 1.9-1.7 1.1-.6 1.9-2-.1L8 14.2l-1.7-1.2-2 .1-.6-1.9L2 10.1l.6-1.9L2 6.3l1.7-1.1.6-1.9 2 .1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.6 8.1l1.7 1.7 3.2-3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
</svg>
<script src="dist/prototype.js"></script>
</body>
</html>
