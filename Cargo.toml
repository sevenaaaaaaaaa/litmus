[workspace]
resolver = "2"
members = [
    "kernel/crates/kernel-core",
    "kernel/crates/kernel-md",
    "kernel/crates/kernel-store",
    "kernel/crates/kernel-sync",
    "kernel/crates/kernel-design",
    "kernel/crates/kernel-browser",
    "kernel/crates/kernel-a2ui",
    "kernel/crates/kernel-deploy",
    "kernel/crates/kernel-backup",
    "kernel/crates/kernel-convert",
    "server",
    "mcp",
    "cli",
    "desktop",
]
default-members = [
    "kernel/crates/kernel-core",
    "kernel/crates/kernel-md",
    "kernel/crates/kernel-store",
    "kernel/crates/kernel-sync",
    "kernel/crates/kernel-design",
    "kernel/crates/kernel-browser",
    "kernel/crates/kernel-a2ui",
    "kernel/crates/kernel-deploy",
    "server",
    "mcp",
    "cli",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
automerge = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
ring = "0.17"
ulid = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
walkdir = "2"
notify = "6"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
age = "0.11"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "process"] }
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "gzip", "brotli", "deflate"] }
futures-util = "=0.3.31"
futures-channel = "=0.3.31"
futures-sink = "=0.3.31"

[profile.release]
lto = "thin"

# Xcode 27 SwiftPM 内化 @_cdecl 符号，swift-rs 1.0.8 的 globalize 只处理
# 包名同名成员，SwiftRs.o 里的 3 个符号漏网 → App 链接 undefined。
# vendored 放宽过滤（third_party/swift-rs），上游修复后可移除。
[patch.crates-io]
swift-rs = { path = "third_party/swift-rs" }
