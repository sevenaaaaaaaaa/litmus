[package]
name = "litmus-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "litmus_server"
path = "src/lib.rs"

[dependencies]
kernel-core = { path = "../kernel/crates/kernel-core" }
litmus-mcp = { path = "../mcp" }
kernel-a2ui = { path = "../kernel/crates/kernel-a2ui" }
kernel-deploy = { path = "../kernel/crates/kernel-deploy" }
kernel-convert = { path = "../kernel/crates/kernel-convert" }
kernel-backup = { path = "../kernel/crates/kernel-backup" }
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
notify.workspace = true
futures-util.workspace = true
reqwest.workspace = true
base64.workspace = true
anyhow.workspace = true
sha2.workspace = true
hex.workspace = true
# 知识场「模型设置」只改 litmus.toml 的 [ai] 表，保留用户的注释与其余排版
toml_edit = "0.22"
# 后台扫描线程调低优先级（Linux setpriority）
libc = "0.2"
# 全盘索引（0.27，桌面独占）：独立的 SQLite/FTS5 库，放在这台设备的用户目录
rusqlite.workspace = true

# 内嵌终端（0.27，桌面独占）：真 PTY。手机上没有终端，不编进去
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
portable-pty = "0.8"

[dev-dependencies]
tempfile.workspace = true
tokio-tungstenite = "0.29"
tower.workspace = true
